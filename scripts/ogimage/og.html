<!DOCTYPE html>
<!--
  The share images of gomi.dev (og:image), 1200x630. scripts/ogimage.sh
  takes a screenshot of each pattern into docs/ogimage/PATTERN.png;
  preview.html shows them side by side. ?v= picks the pattern: can,
  terminal or spit.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>gomi og:image</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Bitcount+Prop+Single:wght@300..700&family=Fira+Code:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../docs/site.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
body { color: var(--text); font: 28px/1.4 var(--body); }
.card { position: relative; width: 1200px; height: 630px; box-sizing: border-box; overflow: hidden; }
.card[hidden] { display: none; }
.url { font: 600 30px var(--px); color: var(--mid); }
.url b { color: var(--text); font-weight: 600; }
.can-img { image-rendering: pixelated; display: block;
  filter: drop-shadow(6px 0 0 var(--halo)) drop-shadow(-6px 0 0 var(--halo)) drop-shadow(0 6px 0 var(--halo)) drop-shadow(0 -6px 0 var(--halo)); }
.chip { position: absolute; font: 500 24px var(--mono); padding: 10px 16px; color: var(--text); background: var(--paper);
  box-shadow: 0 -4px 0 var(--line), 0 4px 0 var(--line), -4px 0 0 var(--line), 4px 0 0 var(--line), 6px 10px 0 var(--shade); }
.chip::before { content: "▤ "; color: var(--mid); }

/* 1: the can and the headline */
.v1 { display: grid; grid-template-columns: 1fr 420px; align-items: center; padding: 0 80px 0 90px; gap: 30px; }
.v1 h1 { margin: 0; font: 700 92px/1.02 var(--px); letter-spacing: -0.01em; }
.v1 p { margin: 26px 0 0; font-size: 30px; line-height: 1.45; color: var(--text); max-width: 20em; }
.v1 p code { font: 500 .9em var(--mono); background: var(--pale); padding: 2px 10px; }
.v1 .url { margin-top: 40px; }
.v1 .can-img { width: 400px; }

/* 2: the terminal */
.v2 { padding: 34px 44px 0; }
.v2 .top { display: flex; align-items: center; gap: 22px; height: 92px; }
.v2 .top img { width: 84px; }
.v2 .top h1 { margin: 0; font: 700 56px/1 var(--px); flex: 1; }
.v2 .top .url { font-size: 28px; }
.v2 .term { margin-top: 20px; }
.v2 .tscreen { font-size: 14.5px; padding: 12px 14px; overflow: hidden; }

/* 3: the can gives a file back */
.v3 .can-img { position: absolute; width: 360px; left: 110px; top: 170px; }
.v3 .bubble { position: absolute; left: 90px; top: 64px; font: 400 30px/1.3 var(--px); padding: 14px 24px; transform: none; min-width: 0; max-width: none; }
.v3 .chip.a { left: 430px; top: 140px; transform: rotate(-8deg); }
.v3 .chip.b { left: 500px; top: 238px; transform: rotate(5deg); }
.v3 .chip.c { left: 440px; top: 340px; transform: rotate(-3deg); }
.v3 .trail { position: absolute; left: 400px; top: 200px; width: 90px; height: 120px; border: dashed var(--mid); border-width: 4px 4px 0 0; border-radius: 0 60px 0 0; opacity: .6; }
.v3 .text { position: absolute; right: 60px; top: 40px; bottom: 40px; width: 380px; display: flex; flex-direction: column; justify-content: center; }
.v3 h1 { margin: 0; font: 700 58px/1.04 var(--px); }
.v3 p { margin: 22px 0 0; font-size: 28px; line-height: 1.45; }
.v3 p code { font: 500 .9em var(--mono); background: var(--pale); padding: 2px 10px; }
.v3 .url { margin-top: 32px; }
</style>
</head>
<body>
<section class="card v1" data-v="can" hidden>
  <div>
    <h1>I keep what you rm.</h1>
    <p>A trash can for the command line. Use it like <code>rm</code>, and <code>rm -b</code> brings files back.</p>
    <div class="url"><b>gomi</b>.dev</div>
  </div>
  <img class="can-img" src="../../docs/favicon/web-app-manifest-512x512.png" alt="">
</section>

<section class="card v2" data-v="terminal" hidden>
  <div class="top">
    <img class="can-img" src="../../docs/favicon/web-app-manifest-192x192.png" alt="">
    <h1>I keep what you rm.</h1>
    <div class="url"><b>gomi</b>.dev</div>
  </div>
  <div class="term">
    <div class="tscreen" id="screen"></div>
  </div>
</section>

<section class="card v3" data-v="spit" hidden>
  <div class="bubble px">Here you go: thesis_final_v3.docx.</div>
  <img class="can-img" src="../../docs/favicon/web-app-manifest-512x512.png" alt="">
  <div class="trail"></div>
  <div class="chip a">thesis_final_v3.docx</div>
  <div class="chip b">notes.txt</div>
  <div class="chip c">.env</div>
  <div class="text">
    <h1>Threw it out? Take it back.</h1>
    <p><code>rm</code> into the trash, <code>rm -b</code> out of it.</p>
    <div class="url"><b>gomi</b>.dev</div>
  </div>
</section>

<script type="module">
import { createTerminal } from '../../docs/tui/terminal.js';
import { fit } from '../../docs/tui/fit.js';
import { SEED } from '../../docs/trash.js';

const q = new URLSearchParams(location.search);
const v = q.get('v') || 'can';
document.querySelector('[data-v="' + v + '"]').hidden = false;

if (v === 'terminal') {
  // rm -b as the site's terminal draws it, the cursor on a Go file so that
  // the preview has colors. The clock stands still, so that the days and
  // times come out the same each time the image is drawn.
  const now = Date.parse('2026-10-25T21:00:00+09:00');
  const term = createTerminal({ now: () => new Date(now), previewDelay: 0 });
  const screen = document.getElementById('screen');
  await document.fonts.ready;
  const P = term.palette();
  screen.style.background = P.bg; screen.style.color = P.fg;
  term.size(fit(screen).cols, 23);
  SEED.forEach(s => term.add(Object.assign({}, s, { at: new Date(now - s.m * 60000) })));
  // the lines above it, as a shell would have them
  term.echo('rm zz_probe_test.go zz_probe2_test.go');
  term.echo('go test ./internal/ui');
  term.print('ok    github.com/babarot/gomi/internal/ui  0.412s');
  term.run();
  screen.innerHTML = term.html();
}
</script>
</body>
</html>
